<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#721522">
  <title>Recuperación · Control Hípico</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/ui-system.css">
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card auth-card--recovery">
      <div class="auth-panel auth-panel--recovery">
        <img class="brand-logo brand-logo--access" src="./icons/icon-192.png" alt="Control Hípico">
        <h2>Recuperación segura</h2>
        <p>Restablece únicamente el almacenamiento local si Control Hípico no logra iniciar. Tu cuenta y los datos guardados en la nube no se eliminan.</p>
        <div id="status" class="ui-state" aria-live="polite">Lista para recuperar Control Hípico.</div>
        <div class="recovery-actions">
          <button id="reset" class="button button--primary" type="button">Restablecer almacenamiento y abrir</button>
          <a class="button button--ghost" href="./index.html?retry=1">Abrir sin restablecer datos</a>
        </div>
        <small class="muted">Control Hípico · Recuperación aislada del producto</small>
      </div>
    </section>
  </main>
  <script src="./assets/js/recovery.js"></script>
</body>
</html>
