<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#721522">
  <meta name="description" content="PWA operativa de Control Hípico para registrar, liquidar y auditar jornadas, con soporte de WhatsApp SOURCE/LAB.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script src="./assets/js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="./assets/css/app.css">
  <title>Control Hípico</title>
  <meta name="application-version" content="1.13.0-rc3">
</head>
<body>
  <div id="app" class="app-loading">
    <div class="splash-card">
      <img class="brand-logo brand-logo--splash" src="./logo-control-hipico.png" alt="Control Hípico">
      <strong>Control Hípico</strong>
      <span data-boot-status>Preparando la jornada…</span>
      <small class="splash-owner">Aplicación operativa</small>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="./assets/js/compat.js"></script>
  <script src="./runtime-config.js"></script>
  <script type="module" src="./assets/js/notice-bridge.js"></script>
  <script type="module" src="./assets/js/dialog-accessibility.js"></script>
  <script type="module" src="./assets/js/financial-config-guard.js"></script>
  <script type="module" src="./assets/js/race-context-guard.js"></script>
  <script type="module" src="./assets/js/race-opening-assistant.js"></script>
  <script type="module" src="./assets/js/backup-secure-ui.js"></script>
  <script type="module" src="./assets/js/app.js"></script>
  <script type="module" src="./assets/js/user-access.js"></script>
  <script type="module" src="./assets/js/password-recovery.js"></script>
  <script type="module" src="./assets/js/help-center.js"></script>
  <script type="module" src="./assets/js/presentation-access.js"></script>
  <script type="module" src="./assets/js/operational-access-guard.js"></script>
</body>
</html>
