name: Issue 857 isolated implementation

on:
  push:
    branches:
      - feat/857-business-location-authority

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[857-impl]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/857-business-location-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write regression first and prove RED
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/business_location_issue_857.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const read=(path)=>fs.readFileSync(path,'utf8');
          test('Business Location is a single tenant-scoped authority with safe boundaries',()=>{
            const schema=read('backend/prisma/schema.prisma');
            const migration=read('backend/prisma/migrations/20260930174500_issue_857_business_location_authority/migration.sql');
            const routes=read('backend/src/modules/business-locations/business-locations.routes.ts');
            const policy=read('backend/src/modules/business-locations/business-location.policy.ts');
            const manifest=read('backend/src/modules/route-manifest.ts');
            assert.match(schema,/model BusinessLocation\s*\{/);
            assert.match(schema,/@@unique\(\[tenantId, code\]\)/);
            assert.match(schema,/timezone\s+String/);
            assert.match(schema,/addressGeocodeId\s+String\?/);
            assert.doesNotMatch(schema,/model BusinessLocation[\s\S]*?(businessHours|stock|resources|pricing)\s+Json/);
            assert.match(migration,/CHECK \("status" IN \('active','inactive','closed'\)\)/);
            assert.match(migration,/pg_timezone_names/);
            assert.match(migration,/BUSINESS_LOCATION_ADDRESS_TENANT_MISMATCH/);
            assert.match(migration,/ON DELETE SET NULL/);
            assert.match(routes,/requirePermission\('admin\.manage'\)/);
            assert.match(routes,/confirmTimezoneChange/);
            assert.doesNotMatch(routes,/router\.delete\s*\(/i);
            assert.match(policy,/Intl\.DateTimeFormat/);
            assert.match(manifest,/business-locations/);
          });

          test('frontend exposes a reusable selector and management surface without duplicating location state',()=>{
            const registry=read('frontend/src/data/pageRegistry.js');
            const page=read('frontend/src/pages/BusinessLocationsPage.js');
            const selector=read('frontend/src/components/businessLocationSelector.js');
            const service=read('frontend/src/services/businessLocationsService.js');
            assert.match(registry,/sedes: \['\.\/pages\/BusinessLocationsPage\.js'/);
            assert.match(page,/BusinessLocationsService/);
            assert.match(page,/confirmTimezoneChange/);
            assert.match(page,/data-location-deactivate/);
            assert.match(selector,/BusinessLocationSelector/);
            assert.match(selector,/location\.id/);
            assert.doesNotMatch(service,/tenantId\s*:/);
            assert.match(service,/\/business-locations/);
          });
          EOF
          set +e
          node --test tests/business_location_issue_857.test.mjs > /tmp/issue857-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/issue857-red.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected RED before implementation, but regression passed.' >&2
            exit 1
          fi
          echo 'RED_CONFIRMED'

      - name: Implement Business Location authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/src/modules/business-locations
          mkdir -p backend/prisma/migrations/20260930174500_issue_857_business_location_authority
          mkdir -p docs/plans

          cat > backend/src/modules/business-locations/business-location.policy.ts <<'EOF'
          import { HttpError } from '../../shared/http.js';

          export const BUSINESS_LOCATION_STATUSES = ['active','inactive','closed'] as const;
          export type BusinessLocationStatus = typeof BUSINESS_LOCATION_STATUSES[number];

          export function normalizeBusinessLocationCode(value: unknown): string {
            const code=String(value ?? '').trim().toUpperCase();
            if(!/^[A-Z0-9][A-Z0-9_-]{0,31}$/.test(code)) {
              throw new HttpError(400,'El código de sede debe usar 1-32 caracteres A-Z, 0-9, _ o -.',{code:'BUSINESS_LOCATION_CODE_INVALID'});
            }
            return code;
          }

          export function assertIanaTimezone(value: unknown): string {
            const timezone=String(value ?? '').trim();
            if(!timezone) throw new HttpError(400,'La zona horaria IANA es obligatoria.',{code:'BUSINESS_LOCATION_TIMEZONE_REQUIRED'});
            try { new Intl.DateTimeFormat('en-US',{timeZone:timezone}).format(new Date()); }
            catch { throw new HttpError(400,'Zona horaria IANA inválida.',{code:'BUSINESS_LOCATION_TIMEZONE_INVALID'}); }
            return timezone;
          }

          export function normalizeOptionalContact(value: unknown, max=160): string | null {
            const normalized=String(value ?? '').trim();
            if(!normalized) return null;
            if(normalized.length>max) throw new HttpError(400,'El dato de contacto excede el máximo permitido.',{code:'BUSINESS_LOCATION_CONTACT_INVALID'});
            return normalized;
          }
          EOF

          cat > backend/src/modules/business-locations/business-locations.routes.ts <<'EOF'
          import { Router } from 'express';
          import { z } from 'zod';
          import { prisma } from '../../database/prisma.js';
          import { asyncHandler, HttpError, ok } from '../../shared/http.js';
          import { requirePermission, requireTenant } from '../../shared/middleware/context.js';
          import { validateBody } from '../../shared/middleware/validate.js';
          import { writeAudit } from '../../shared/services/audit.service.js';
          import { assertIanaTimezone, normalizeBusinessLocationCode, normalizeOptionalContact } from './business-location.policy.js';

          const router=Router();
          const context=(req:any)=>req.context as {tenantId:string;userId?:string;ip?:string;userAgent?:string};
          const createSchema=z.object({
            code:z.string().min(1).max(32),
            name:z.string().trim().min(1).max(160),
            timezone:z.string().trim().min(1).max(100),
            addressGeocodeId:z.string().uuid().optional().nullable(),
            phone:z.string().max(80).optional().nullable(),
            email:z.string().email().max(160).optional().nullable()
          }).strict();
          const updateSchema=z.object({
            name:z.string().trim().min(1).max(160).optional(),
            timezone:z.string().trim().min(1).max(100).optional(),
            addressGeocodeId:z.string().uuid().optional().nullable(),
            phone:z.string().max(80).optional().nullable(),
            email:z.string().email().max(160).optional().nullable(),
            confirmTimezoneChange:z.boolean().optional()
          }).strict();
          const listStatuses=new Set(['active','inactive','closed']);

          router.use(requireTenant);

          async function ensureAddressTenant(tenantId:string,addressGeocodeId:string|null|undefined){
            if(!addressGeocodeId) return null;
            const address=await prisma.addressGeocode.findFirst({where:{id:addressGeocodeId,tenantId},select:{id:true}});
            if(!address) throw new HttpError(400,'La dirección no pertenece al tenant activo.',{code:'BUSINESS_LOCATION_ADDRESS_TENANT_MISMATCH'});
            return address.id;
          }
          async function getOwned(tenantId:string,id:string){
            const location=await prisma.businessLocation.findFirst({where:{id,tenantId}});
            if(!location) throw new HttpError(404,'Sede no encontrada.',{code:'BUSINESS_LOCATION_NOT_FOUND'});
            return location;
          }
          async function audit(req:any,action:string,before:any,after:any){
            const ctx=context(req);
            await writeAudit({tenantId:ctx.tenantId,userId:ctx.userId,action,entity:'BusinessLocation',entityId:after?.id||before?.id,before,after,ipAddress:ctx.ip,userAgent:ctx.userAgent});
          }

          router.get('/',asyncHandler(async(req,res)=>{
            const ctx=context(req);
            const status=typeof req.query.status==='string'?req.query.status:undefined;
            if(status && !listStatuses.has(status)) throw new HttpError(400,'Estado de sede inválido.',{code:'BUSINESS_LOCATION_STATUS_INVALID'});
            const search=typeof req.query.search==='string'?req.query.search.trim():'';
            const locations=await prisma.businessLocation.findMany({
              where:{tenantId:ctx.tenantId,...(status?{status}:{}),...(search?{OR:[{code:{contains:search,mode:'insensitive'}},{name:{contains:search,mode:'insensitive'}}]}:{})},
              orderBy:[{status:'asc'},{name:'asc'}]
            });
            ok(res,locations);
          }));

          router.get('/:id',asyncHandler(async(req,res)=>ok(res,await getOwned(context(req).tenantId,req.params.id))));

          router.post('/',requirePermission('admin.manage'),validateBody(createSchema),asyncHandler(async(req,res)=>{
            const ctx=context(req);
            const addressGeocodeId=await ensureAddressTenant(ctx.tenantId,req.body.addressGeocodeId);
            const data={tenantId:ctx.tenantId,code:normalizeBusinessLocationCode(req.body.code),name:req.body.name.trim(),status:'active',timezone:assertIanaTimezone(req.body.timezone),addressGeocodeId,phone:normalizeOptionalContact(req.body.phone,80),email:normalizeOptionalContact(req.body.email,160),createdBy:ctx.userId||null,updatedBy:ctx.userId||null};
            try {
              const created=await prisma.businessLocation.create({data});
              await audit(req,'business-location.created',null,created);
              ok(res,created,201);
            } catch(error:any) {
              if(error?.code==='P2002') throw new HttpError(409,'Ya existe una sede con ese código para el tenant.',{code:'BUSINESS_LOCATION_CODE_CONFLICT'});
              throw error;
            }
          }));

          router.patch('/:id',requirePermission('admin.manage'),validateBody(updateSchema),asyncHandler(async(req,res)=>{
            const ctx=context(req); const before=await getOwned(ctx.tenantId,req.params.id);
            const timezone=req.body.timezone===undefined?undefined:assertIanaTimezone(req.body.timezone);
            if(timezone && timezone!==before.timezone && req.body.confirmTimezoneChange!==true) throw new HttpError(409,'Confirma explícitamente el cambio de zona horaria; afecta la interpretación de operaciones futuras.',{code:'BUSINESS_LOCATION_TIMEZONE_CONFIRMATION_REQUIRED'});
            const addressGeocodeId=req.body.addressGeocodeId===undefined?undefined:await ensureAddressTenant(ctx.tenantId,req.body.addressGeocodeId);
            const after=await prisma.businessLocation.update({where:{id:before.id},data:{...(req.body.name!==undefined?{name:req.body.name.trim()}:{}),...(timezone!==undefined?{timezone}:{}),...(addressGeocodeId!==undefined?{addressGeocodeId}:{}),...(req.body.phone!==undefined?{phone:normalizeOptionalContact(req.body.phone,80)}:{}),...(req.body.email!==undefined?{email:normalizeOptionalContact(req.body.email,160)}:{}),updatedBy:ctx.userId||null}});
            await audit(req,'business-location.updated',before,after); ok(res,after);
          }));

          async function transition(req:any,res:any,status:'active'|'inactive'|'closed',action:string){
            const ctx=context(req); const before=await getOwned(ctx.tenantId,req.params.id);
            const after=await prisma.businessLocation.update({where:{id:before.id},data:{status,updatedBy:ctx.userId||null}});
            await audit(req,action,before,after); ok(res,after);
          }
          router.post('/:id/deactivate',requirePermission('admin.manage'),asyncHandler(async(req,res)=>transition(req,res,'inactive','business-location.deactivated')));
          router.post('/:id/close',requirePermission('admin.manage'),asyncHandler(async(req,res)=>transition(req,res,'closed','business-location.closed')));
          router.post('/:id/reopen',requirePermission('admin.manage'),asyncHandler(async(req,res)=>transition(req,res,'active','business-location.reopened')));

          export default router;
          EOF

          cat > backend/prisma/migrations/20260930174500_issue_857_business_location_authority/migration.sql <<'EOF'
          -- #857 canonical tenant Business Location authority.
          -- No legacy free-text location/room fields are reinterpreted without an explicit mapping.
          CREATE TABLE IF NOT EXISTS "BusinessLocation" (
            "id" TEXT NOT NULL,
            "tenantId" TEXT NOT NULL,
            "code" TEXT NOT NULL,
            "name" TEXT NOT NULL,
            "status" TEXT NOT NULL DEFAULT 'active',
            "timezone" TEXT NOT NULL,
            "addressGeocodeId" TEXT,
            "phone" TEXT,
            "email" TEXT,
            "createdBy" TEXT,
            "updatedBy" TEXT,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "BusinessLocation_pkey" PRIMARY KEY ("id"),
            CONSTRAINT "BusinessLocation_status_check" CHECK ("status" IN ('active','inactive','closed')),
            CONSTRAINT "BusinessLocation_code_check" CHECK ("code" = upper(btrim("code")) AND "code" ~ '^[A-Z0-9][A-Z0-9_-]{0,31}$'),
            CONSTRAINT "BusinessLocation_tenant_fkey" FOREIGN KEY ("tenantId") REFERENCES "Tenant"("id") ON DELETE RESTRICT ON UPDATE CASCADE,
            CONSTRAINT "BusinessLocation_address_fkey" FOREIGN KEY ("addressGeocodeId") REFERENCES "AddressGeocode"("id") ON DELETE SET NULL ON UPDATE CASCADE
          );

          CREATE UNIQUE INDEX IF NOT EXISTS "BusinessLocation_tenantId_code_key" ON "BusinessLocation"("tenantId","code");
          CREATE INDEX IF NOT EXISTS "BusinessLocation_tenantId_status_idx" ON "BusinessLocation"("tenantId","status");
          CREATE INDEX IF NOT EXISTS "BusinessLocation_tenantId_addressGeocodeId_idx" ON "BusinessLocation"("tenantId","addressGeocodeId");

          CREATE OR REPLACE FUNCTION public.contagest_business_location_guard()
          RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_timezone_names WHERE name = NEW."timezone") THEN
              RAISE EXCEPTION 'BUSINESS_LOCATION_TIMEZONE_INVALID:%', NEW."timezone" USING ERRCODE='23514';
            END IF;
            IF NEW."addressGeocodeId" IS NOT NULL AND NOT EXISTS (
              SELECT 1 FROM "AddressGeocode" a WHERE a."id"=NEW."addressGeocodeId" AND a."tenantId"=NEW."tenantId"
            ) THEN
              RAISE EXCEPTION 'BUSINESS_LOCATION_ADDRESS_TENANT_MISMATCH' USING ERRCODE='23514';
            END IF;
            RETURN NEW;
          END $$;

          DROP TRIGGER IF EXISTS "BusinessLocation_guard" ON "BusinessLocation";
          CREATE TRIGGER "BusinessLocation_guard"
          BEFORE INSERT OR UPDATE OF "tenantId","timezone","addressGeocodeId" ON "BusinessLocation"
          FOR EACH ROW EXECUTE FUNCTION public.contagest_business_location_guard();
          EOF

          cat > frontend/src/services/businessLocationsService.js <<'EOF'
          import { BackendApi } from './backendApi.js';
          export const BusinessLocationsService={
            list({search='',status=''}={}){const q=new URLSearchParams();if(search)q.set('search',search);if(status&&status!=='all')q.set('status',status);return BackendApi.get(`/business-locations${q.size?`?${q}`:''}`);},
            get(id){return BackendApi.get(`/business-locations/${encodeURIComponent(id)}`);},
            create(data){return BackendApi.post('/business-locations',data);},
            update(id,data){return BackendApi.patch(`/business-locations/${encodeURIComponent(id)}`,data);},
            deactivate(id){return BackendApi.post(`/business-locations/${encodeURIComponent(id)}/deactivate`,{});},
            close(id){return BackendApi.post(`/business-locations/${encodeURIComponent(id)}/close`,{});},
            reopen(id){return BackendApi.post(`/business-locations/${encodeURIComponent(id)}/reopen`,{});}
          };
          EOF

          cat > frontend/src/components/businessLocationSelector.js <<'EOF'
          import { Select } from './ui/index.js';
          export function BusinessLocationSelector({locations=[],value='',name='businessLocationId',label='Sede',includeInactive=false,required=false}={}){
            const eligible=(locations||[]).filter((location)=>includeInactive||location.status==='active');
            return Select({labelKey:label,name,value,required,options:[{value:'',label:'Selecciona una sede'},...eligible.map((location)=>({value:location.id,label:`${location.code} · ${location.name}`}))]});
