          cat > docs/plans/2026-09-30-issue-857-business-location-authority.md <<'EOF'
          # #857 Business Location Authority — implementation plan

          Baseline: `main@3a278d0a321ab3e00fd090aeb9d1f82ebec17eeb`.

          ## Characterization
          - Production PG17 read-only inventory found `AddressGeocode` as the reusable geocode authority, no transversal BusinessLocation/Warehouse/Site/Branch table, and legacy domain strings such as `GymClass.location` / `CareAppointment.room` without a safe mapping.
          - #755 owns inventory Warehouse/Location, #848 owns scheduling/resources, #765 owns POS register/shift, and #849 owns service eligibility.
          - Therefore this ticket introduces only tenant site identity, IANA timezone, safe lifecycle and reusable IDs. It does not backfill ambiguous legacy strings and does not own stock, hours, resources or pricing.

          ## Implementation
          1. Add canonical Prisma `BusinessLocation` and forward migration with tenant/code uniqueness, status constraint, IANA timezone guard and tenant-safe `AddressGeocode` guard.
          2. Add tenant-derived API list/get/create/update/deactivate/close/reopen; no hard-delete; admin permission only for writes; audit every mutation.
          3. Add frontend service, management page, and reusable `BusinessLocationSelector`.
          4. Register backend `/business-locations`, frontend `sedes`, and authoritative regression contract.
          5. Validate Prisma, targeted contracts/unit tests, typecheck, frontend build, isolated PostgreSQL 17 migration/invariants and browser component surface.
          EOF

          python <<'PY'
          from pathlib import Path

          schema=Path('backend/prisma/schema.prisma')
          text=schema.read_text()
          def add_to_model(src, model, line):
              start=src.index(f'model {model} {{')
              end=src.index('\n}', start)
              block=src[start:end]
              if line.strip() in block:
                  return src
              return src[:end]+'\n  '+line.strip()+src[end:]
          text=add_to_model(text,'Tenant','businessLocations BusinessLocation[]')
          text=add_to_model(text,'AddressGeocode','businessLocations BusinessLocation[]')
          if 'model BusinessLocation {' not in text:
              marker='\nmodel DemoAccess {'
              model='''\nmodel BusinessLocation {\n  id               String   @id @default(uuid())\n  tenantId         String\n  code             String\n  name             String\n  status           String   @default("active")\n  timezone         String\n  addressGeocodeId String?\n  phone            String?\n  email            String?\n  createdBy        String?\n  updatedBy        String?\n  createdAt        DateTime @default(now())\n  updatedAt        DateTime @updatedAt\n\n  tenant           Tenant          @relation(fields: [tenantId], references: [id], onDelete: Restrict)\n  addressGeocode   AddressGeocode? @relation(fields: [addressGeocodeId], references: [id], onDelete: SetNull)\n\n  @@unique([tenantId, code])\n  @@index([tenantId, status])\n  @@index([tenantId, addressGeocodeId])\n}\n'''
              text=text.replace(marker,model+marker)
          schema.write_text(text)

          manifest=Path('backend/src/modules/route-manifest.ts')
          text=manifest.read_text()
          imp="import businessLocationRoutes from './business-locations/business-locations.routes.js';\n"
          if imp not in text:
              text=text.replace("import documentSequenceRoutes from './document-sequences/document-sequences.routes.js';\n", "import documentSequenceRoutes from './document-sequences/document-sequences.routes.js';\n"+imp)
