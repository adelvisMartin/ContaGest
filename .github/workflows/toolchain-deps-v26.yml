name: Toolchain dependency cleanup v26

on:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - package.json
      - backend/package.json
      - backend/src/modules/exports/xlsx-writer.ts
      - backend/src/modules/exports/xlsx-writer.test.ts
      - frontend/scripts/stage-backend.mjs
      - scripts/normalize-package-lock-v26.mjs
      - tests/toolchain_dependency_cleanup_issue_26.test.mjs
      - tests/toolchain_lock_normalizer_issue_26.test.mjs
      - .github/workflows/toolchain-deps-v26.yml
  pull_request:
    branches: [main]
    paths:
      - package-lock.json
      - package.json
      - backend/package.json
      - backend/src/modules/exports/xlsx-writer.ts
      - backend/src/modules/exports/xlsx-writer.test.ts
      - frontend/scripts/stage-backend.mjs
      - scripts/normalize-package-lock-v26.mjs
      - tests/toolchain_dependency_cleanup_issue_26.test.mjs
      - tests/toolchain_lock_normalizer_issue_26.test.mjs
      - .github/workflows/toolchain-deps-v26.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-lock:
    name: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify lock normalizer behavior
        run: node --test tests/toolchain_lock_normalizer_issue_26.test.mjs

      - name: Normalize retired XLSX dependency graph
        run: node scripts/normalize-package-lock-v26.mjs

      - name: Regenerate lock deterministically
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update deepmerge-ts qs --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lock evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-lock-v26-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify lock and workflow contracts
        run: |
          node scripts/normalize-package-lock-v26.mjs --check
          node --test tests/toolchain_dependency_cleanup_issue_26.test.mjs

      - name: Persist patched lock on internal cleanup PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/verticals-clean-code-batch-1'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already patched and reproducible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): persist patched dependency lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Ensure checked-in lock is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Clean install from checked-in lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify obsolete target versions remain absent
        shell: bash
        run: |
          set -euo pipefail
          npm ls rimraf lodash.isequal inflight glob fstream uuid --all || status=$?
          status=${status:-0}
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          node --test tests/toolchain_dependency_cleanup_issue_26.test.mjs

      - name: Internal XLSX writer smoke
        run: npm --workspace backend run test:xlsx

      - name: Serverless bundle excludes retired XLSX runtime chain
        run: node frontend/scripts/stage-backend.mjs
