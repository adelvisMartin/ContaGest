name: Toolchain dependency cleanup v26

on:
  push:
    branches:
      - chore/issue-26-toolchain-lock-repair
    paths:
      - package-lock.json
      - package.json
      - backend/package.json
      - tests/toolchain_dependency_cleanup_issue_26.test.mjs
      - .github/workflows/toolchain-deps-v26.yml
  pull_request:
    branches: [main]
    paths:
      - package-lock.json
      - package.json
      - backend/package.json
      - tests/toolchain_dependency_cleanup_issue_26.test.mjs
      - .github/workflows/toolchain-deps-v26.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-typecheck:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/toolchain-lock-v26-finalize'
    name: repair-typecheck-once
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Narrow account row before parentCode access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/modules/imports/imports.routes.ts')
          s=p.read_text()
          old="""    if(type==='accounts'&&normalized.parentCode&&!dbAccountCodes.has(normalized.parentCode)&&!plannedAccountCodes.has(normalized.parentCode))errors.push(issue('parentCode','IMPORT_PARENT_NOT_FOUND',`La cuenta padre ${normalized.parentCode} no existe ni está incluida en el batch.`));"""
          new="""    if(type==='accounts'){
      const account=normalized as z.infer<typeof accountRow>;
      if(account.parentCode&&!dbAccountCodes.has(account.parentCode)&&!plannedAccountCodes.has(account.parentCode))errors.push(issue('parentCode','IMPORT_PARENT_NOT_FOUND',`La cuenta padre ${account.parentCode} no existe ni está incluida en el batch.`));
    }"""
          if old not in s:
              print('target already repaired or changed; no broad edit performed')
          else:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact repair
        env:
          REPAIR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/src/modules/imports/imports.routes.ts; then
            echo "typecheck repair already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/imports/imports.routes.ts
          git commit -m "fix(typecheck): estrechar fila accounts antes de parentCode"
          git push origin "HEAD:${REPAIR_BRANCH}"

  dependency-lock:
    name: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lock deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lock evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-lock-v26-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify lock contract
        run: node --test tests/toolchain_dependency_cleanup_issue_26.test.mjs

      - name: Ensure checked-in lock is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Clean install from regenerated lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify obsolete target versions are absent
        shell: bash
        run: |
          set -euo pipefail
          npm ls rimraf lodash.isequal inflight glob fstream uuid --all || status=$?
          status=${status:-0}
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          node --test tests/toolchain_dependency_cleanup_issue_26.test.mjs

      - name: ExcelJS compatibility smoke
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import ExcelJS from 'exceljs';
          const workbook = new ExcelJS.Workbook();
          const sheet = workbook.addWorksheet('QA');
          sheet.addRow(['ContaGest', 26]);
          const buffer = await workbook.xlsx.writeBuffer();
          if (!buffer || buffer.length === 0) throw new Error('ExcelJS no generó XLSX');
          const roundTrip = new ExcelJS.Workbook();
          await roundTrip.xlsx.load(buffer);
          if (roundTrip.getWorksheet('QA')?.getCell('A1').value !== 'ContaGest') {
            throw new Error('ExcelJS no preservó el contenido en round-trip');
          }
          NODE
