name: ContaGest Static QA

# The repository characterization tests are already covered by `npm test` in
# ci.yml. Keep this focused workflow available for manual diagnostics without
# charging every pull request twice for the same assertions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Repository characterization
        run: node --test tests/repository.test.mjs tests/v11_9_features.test.mjs
