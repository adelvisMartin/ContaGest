name: E2E comercial #23/#30 · PostgreSQL efímero

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/commercial/**'
      - 'backend/src/shared/commercial/**'
      - 'backend/prisma/**'
      - 'frontend/src/pages/LicensesPage.js'
      - 'frontend/src/services/commercialService.js'
      - 'frontend/src/services/commercialAccessEnhancer.js'
      - 'frontend/src/services/licenseService.js'
      - 'frontend/src/utils/commercialExport.js'
      - 'frontend/src/utils/csvFormulaGuard.js'
      - 'frontend/src/services/csv.js'
      - 'tests/frontend_csv_formula_guard_v1313.test.mjs'
      - 'qa/commercial-backend-real-v23.test.ts'
      - 'qa/erp-operational-crud-v664.test.ts'
      - 'tests/qa_append_only_audit_cleanup_v638_v664.test.mjs'
      - 'qa/crud-audit-atomicity-v638.test.ts'
      - 'qa/support/real-backend-harness.ts'
      - 'backend/src/modules/crud.factory.ts'
      - 'backend/src/modules/crud-policy.ts'
      - 'backend/src/shared/services/audit.service.ts'
      - 'tests/crud_factory_hardening_issue_638.test.mjs'
      - 'tests/commercial_console_issue_23.test.mjs'
      - 'tests/v11_15_service_restriction_governance.test.mjs'
      - 'ops/database/prepare-supabase-ephemeral.sql'
      - 'package.json'
      - '.github/workflows/e2e-commercial-v23.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: e2e-commercial-v23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-comercial-real:
    name: Backend + PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_e2e?schema=public
      APP_URL: http://127.0.0.1:8080
      CORS_ORIGIN: http://127.0.0.1:8080
      JWT_SECRET: e2e_only_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEF
      LICENSE_HASH_SECRET: e2e_only_license_secret_0123456789abcdefghijklmnopqrstuvwxyz_XYZ
      ALLOW_DEV_TENANT_HEADER: 'false'
      SUPABASE_AUTH_FALLBACK: 'false'

    steps:
      - name: Descargar código del HEAD candidato (no merge sintético)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Verificar que el checkout corresponde al HEAD esperado
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas y cliente PostgreSQL
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preparar contratos compatibles con Supabase en la base temporal
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d contagest_e2e -f ops/database/prepare-supabase-ephemeral.sql

      - name: Aplicar historial de migraciones solo en PostgreSQL efímero
        run: npm --workspace backend run prisma:deploy

      - name: Sembrar tenant y administrador QA
        run: npm run seed

      - name: Validar tipos del backend
        run: npm run typecheck

      - name: Ejecutar contratos comerciales y de gobernanza
        run: node --test tests/frontend_csv_formula_guard_v1313.test.mjs tests/commercial_console_issue_23.test.mjs tests/v11_15_service_restriction_governance.test.mjs

      - name: CRUD audit and tenant guards on PostgreSQL 17
        run: |
          node --test tests/crud_factory_hardening_issue_638.test.mjs
          node --test tests/qa_append_only_audit_cleanup_v638_v664.test.mjs
          npm --workspace backend exec -- tsx --test ../qa/crud-audit-atomicity-v638.test.ts ../qa/erp-operational-crud-v664.test.ts

      - name: Ejecutar E2E comercial con backend y PostgreSQL reales
        shell: bash
        run: |
          set -o pipefail
          npm run test:backend:commercial:real 2>&1 | tee e2e-commercial-v23.log

      - name: Registrar procedencia de evidencia por SHA
        if: always()
        shell: bash
        run: |
          printf 'candidateSha=%s\nrunId=%s\nrunAttempt=%s\n' "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > e2e-commercial-v23-provenance.txt
          printf 'jobStatus=%s\n' "${{ job.status }}" >> e2e-commercial-v23-provenance.txt

      - name: Conservar evidencia E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-e2e-comercial-v23-30-${{ env.CANDIDATE_SHA }}
          path: |
            e2e-commercial-v23.log
            e2e-commercial-v23-provenance.txt
          if-no-files-found: warn
          retention-days: 14
