name: E2E comercial #23 · PostgreSQL efímero

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/commercial/**'
      - 'backend/src/shared/commercial/**'
      - 'backend/prisma/**'
      - 'frontend/src/pages/LicensesPage.js'
      - 'frontend/src/services/commercialService.js'
      - 'frontend/src/services/licenseService.js'
      - 'frontend/src/utils/commercialExport.js'
      - 'qa/commercial-backend-real-v23.test.ts'
      - 'tests/commercial_console_issue_23.test.mjs'
      - 'package.json'
      - '.github/workflows/e2e-commercial-v23.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-commercial-v23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-comercial-real:
    name: Backend + PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_e2e?schema=public
      APP_URL: http://127.0.0.1:8080
      CORS_ORIGIN: http://127.0.0.1:8080
      JWT_SECRET: e2e_only_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEF
      LICENSE_HASH_SECRET: e2e_only_license_secret_0123456789abcdefghijklmnopqrstuvwxyz_XYZ
      ALLOW_DEV_TENANT_HEADER: 'false'
      SUPABASE_AUTH_FALLBACK: 'false'

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund

      - name: Preparar roles compatibles con Supabase en la base temporal
        shell: bash
        run: |
          cat > /tmp/contagest-e2e-roles.sql <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $$;
          SQL
          npm --workspace backend exec -- prisma db execute --file /tmp/contagest-e2e-roles.sql --schema prisma/schema.prisma

      - name: Aplicar historial de migraciones solo en PostgreSQL efímero
        run: npm --workspace backend run prisma:deploy

      - name: Sembrar tenant y administrador QA
        run: npm run seed

      - name: Validar tipos del backend
        run: npm run typecheck

      - name: Ejecutar contratos de regresión del issue #23
        run: node --test tests/commercial_console_issue_23.test.mjs

      - name: Ejecutar E2E comercial con backend y PostgreSQL reales
        shell: bash
        run: |
          set -o pipefail
          npm run test:backend:commercial:real 2>&1 | tee e2e-commercial-v23.log

      - name: Conservar evidencia E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-e2e-comercial-v23
          path: e2e-commercial-v23.log
          if-no-files-found: warn
          retention-days: 14
