name: Hípico Control Operations

on:
  pull_request:
    paths:
      - 'frontend/public/hipico-control/**'
      - 'frontend/api/hipico/**'
      - 'frontend/scripts/write-hipico-build-info.mjs'
      - 'backend/src/modules/hipico-bot/**'
      - 'backend/scripts/hipico-*.mjs'
      - 'tools/hipico-whatsapp-bridge/**'
      - 'tools/hipico-whatsapp-web-bridge/**'
      - 'supabase/sql/hipico_*.sql'
      - 'tests/hipico*.test.mjs'
      - 'tests/fixtures/hipico/**'
      - 'qa/hipico-visual-functional-v105.spec.mjs'
      - 'qa/hipico-ui-v41-shell.spec.mjs'
      - 'qa/hipico-ui-v41-shell.spec.mjs-snapshots/**'
      - 'qa/hipico-icon-overlap-v411.spec.mjs'
      - 'qa/hipico-overlay-v413.spec.mjs'
      - 'qa/support/hipico-*.mjs'
      - 'qa/fixtures/hipico-*'
      - 'scripts/hipico-qa-runner-v103.mjs'
      - 'scripts/hipico-exact-sha-gate.mjs'
      - 'scripts/hipico-browser-qa.mjs'
      - 'scripts/hipico-root-contracts.mjs'
      - 'scripts/hipico-visual-baseline-gate.mjs'
      - 'playwright.config.mjs'
      - 'playwright.hipico-matrix.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/hipico/**'
      - '.github/workflows/hipico-operations.yml'
      - 'frontend/package.json'
      - 'INICIAR-HIPICO-AUTONOMO.cmd'
  push:
    branches:
      - main
      - 'feature/hipico-*'
      - 'feat/hipico-*'
      - 'fix/hipico-*'
      - 'refactor/hipico-*'
    paths:
      - 'frontend/public/hipico-control/**'
      - 'frontend/api/hipico/**'
      - 'frontend/scripts/write-hipico-build-info.mjs'
      - 'backend/src/modules/hipico-bot/**'
      - 'backend/scripts/hipico-*.mjs'
      - 'tools/hipico-whatsapp-bridge/**'
      - 'tools/hipico-whatsapp-web-bridge/**'
      - 'supabase/sql/hipico_*.sql'
      - 'tests/hipico*.test.mjs'
      - 'tests/fixtures/hipico/**'
      - 'qa/hipico-visual-functional-v105.spec.mjs'
      - 'qa/hipico-ui-v41-shell.spec.mjs'
      - 'qa/hipico-ui-v41-shell.spec.mjs-snapshots/**'
      - 'qa/hipico-icon-overlap-v411.spec.mjs'
      - 'qa/hipico-overlay-v413.spec.mjs'
      - 'qa/support/hipico-*.mjs'
      - 'qa/fixtures/hipico-*'
      - 'scripts/hipico-qa-runner-v103.mjs'
      - 'scripts/hipico-exact-sha-gate.mjs'
      - 'scripts/hipico-browser-qa.mjs'
      - 'scripts/hipico-root-contracts.mjs'
      - 'scripts/hipico-visual-baseline-gate.mjs'
      - 'playwright.config.mjs'
      - 'playwright.hipico-matrix.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/hipico/**'
      - '.github/workflows/hipico-operations.yml'
      - 'frontend/package.json'
      - 'INICIAR-HIPICO-AUTONOMO.cmd'

permissions:
  contents: read

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hipico-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operations-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hipico_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hipico_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hipico_ci
      HIPICO_DB_CONTRACT_EPHEMERAL: '1'
      HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HIPICO_CANDIDATE_SHA }}
      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/hipico-whatsapp-web-bridge/package-lock.json
      - name: Install root lock for Hípico contracts
        run: npm ci --no-audit --no-fund
      - name: All root Hípico regression contracts
        run: node scripts/hipico-root-contracts.mjs
      - name: UI System v4.1.3, overlay and WhatsApp readiness contracts
        run: >-
          node --test
          tests/hipico_ui_system_v41_contract.test.mjs
          tests/hipico_presentation_preferences_v41.test.mjs
          tests/hipico_icon_action_contract_v41.test.mjs
          tests/hipico_ui_v412_hardening_contract.test.mjs
          tests/hipico_ui_v413_authority_contract.test.mjs
          tests/hipico_overlay_authority_v413.test.mjs
          tests/hipico_whatsapp_v150_readiness_contract.test.mjs
      - name: PWA and serverless operational syntax checks
        run: |
          node --check scripts/hipico-exact-sha-gate.mjs
          node --check scripts/hipico-browser-qa.mjs
          node --check scripts/hipico-root-contracts.mjs
          node --check scripts/hipico-visual-baseline-gate.mjs
          node --check frontend/scripts/write-hipico-build-info.mjs
          node --check frontend/public/hipico-control/assets/js/advanced-group-scope.js
          node --check frontend/public/hipico-control/assets/js/backup-v2.js
          node --check frontend/public/hipico-control/assets/js/backup-secure-ui.js
          node --check frontend/public/hipico-control/assets/js/dialog-accessibility.js
          node --check frontend/public/hipico-control/assets/js/local-auth.js
          node --check frontend/public/hipico-control/assets/js/recovery.js
          node --check frontend/public/hipico-control/assets/js/app.js
          node --check frontend/public/hipico-control/assets/js/ui.js
          node --check frontend/public/hipico-control/assets/js/presentation-preferences.js
          node --check frontend/public/hipico-control/assets/js/shell-ui-v4.js
          node --check frontend/public/hipico-control/assets/js/theme-bootstrap.js
          node --check frontend/public/hipico-control/assets/js/format.js
          node --check frontend/public/hipico-control/assets/js/whatsapp.js
          node --check frontend/public/hipico-control/assets/js/whatsapp/race-context.js
          node --check frontend/public/hipico-control/assets/js/operations.js
          node --check frontend/public/hipico-control/assets/js/agent-router.js
          node --check frontend/public/hipico-control/assets/js/financial-config-guard.js
          node --check frontend/public/hipico-control/assets/js/operational-ledger.js
          node --check frontend/public/hipico-control/assets/js/operational-copy-center.js
          node --check frontend/public/hipico-control/assets/js/operational-access-policy.js
          node --check frontend/public/hipico-control/assets/js/operational-access-guard.js
          node --check frontend/public/hipico-control/assets/js/race-context-guard.js
          node --check frontend/public/hipico-control/assets/js/race-opening-assistant.js
          node --check frontend/public/hipico-control/assets/js/notice-bridge.js
          node --check frontend/public/hipico-control/assets/js/store.js
          node --check frontend/public/hipico-control/assets/js/store-v2.js
          node --check frontend/public/hipico-control/assets/js/sync.js
          node --check frontend/public/hipico-control/assets/js/workspace.js
          node --check frontend/public/hipico-control/sw.js
          node --check frontend/api/hipico/_shared.js
          node --check frontend/api/hipico/bridge-identity.js
          node --check frontend/api/hipico/meta-runtime.js
          node --check frontend/api/hipico/status.js
          node --check frontend/api/hipico/group-bridge-ingest.js
          node --check frontend/api/hipico/whatsapp-send.js
          node --check frontend/api/hipico/whatsapp-webhook.js
          node --check tools/hipico-whatsapp-bridge/src/group-identity.mjs
          node --check tools/hipico-whatsapp-bridge/src/index.mjs
          node --check tools/hipico-whatsapp-web-bridge/src/runtime-config.mjs
          node --check backend/scripts/hipico-audit-idempotency-contract.mjs
          node --check backend/scripts/hipico-db-contract.mjs
          node --check backend/scripts/hipico-outbox-reconciliation-contract.mjs
      - name: PostgreSQL isolated migration, RLS, idempotency, multigroup and operator-confirmation contract
        run: node backend/scripts/hipico-db-contract.mjs
      - name: PostgreSQL ambiguous-delivery reconciliation status contract
        run: node backend/scripts/hipico-outbox-reconciliation-contract.mjs
      - name: PostgreSQL durable cloud audit replay contract
        run: node backend/scripts/hipico-audit-idempotency-contract.mjs
      - name: Backend typecheck
        run: npm --workspace backend run typecheck
      - name: Backend Hípico security, money, parser and conversation contracts
        run: npm --workspace backend run test:hipico
      - name: Install hosted bridge lockfile
        working-directory: tools/hipico-whatsapp-web-bridge
        run: npm ci --no-audit --no-fund
      - name: Hosted bridge syntax and safety tests
        working-directory: tools/hipico-whatsapp-web-bridge
        run: |
          npm run check
          npm test
      - name: Production wording gate
        shell: bash
        run: |
          files=()
          for candidate in \
            frontend/public/hipico-control/index.html \
            frontend/public/hipico-control/recovery.html \
            frontend/public/hipico-control/manifest.webmanifest; do
            [[ -f "$candidate" ]] && files+=("$candidate")
          done
          if ((${#files[@]})) && grep -niE '(^|[^A-Za-z])(QA|TEST|demo|modo local|versión local)([^A-Za-z]|$)' "${files[@]}"; then
            echo 'Forbidden release wording found in Hípico Control user-facing shell.' >&2
            exit 1
          fi

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HIPICO_CANDIDATE_SHA }}
      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Control Hípico responsive, offline and interaction E2E
        run: npm run test:browser:hipico
      - name: Reviewed visual baselines must already exist
        run: node scripts/hipico-visual-baseline-gate.mjs
      - name: Control Hípico UI System v4.1.3 shell, overlay and floating-action E2E
        env:
          HIPICO_QA_SHA: ${{ env.HIPICO_CANDIDATE_SHA }}
        run: >-
          npx playwright test
          qa/hipico-ui-v41-shell.spec.mjs
          qa/hipico-icon-overlap-v411.spec.mjs
          qa/hipico-overlay-v413.spec.mjs
          --project=chromium
          --workers=1
      - name: Upload exact-SHA Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hipico-browser-${{ env.HIPICO_CANDIDATE_SHA }}
          path: |
            artifacts/qa/hipico-browser/${{ env.HIPICO_CANDIDATE_SHA }}/
            artifacts/qa/hipico-v105/${{ env.HIPICO_CANDIDATE_SHA }}/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
