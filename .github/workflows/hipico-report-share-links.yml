name: Hípico report links — scoped capability contracts

on:
  pull_request:
    paths:
      - 'backend/src/modules/hipico/report-share-*'
      - 'backend/src/app.ts'
      - 'backend/prisma/migrations/20261015035000_hipico_report_share_links/**'
      - 'docs/hipico/SECURE_REPORT_LINKS_2026-10-15.md'
      - 'tools/hipico-cli/report-shares.mjs'
      - 'tests/hipico_report_share_cli_contract.test.mjs'
      - 'tests/hipico_report_share_schema_contract.test.mjs'
      - '.github/workflows/hipico-report-share-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck backend changes
        run: npm --workspace backend run typecheck
      - name: Capability, scope, date, CSP, revoke and HTTP negative contracts
        run: npx --no-install tsx --test backend/src/modules/hipico/report-share.routes.test.ts
      - name: Static migration safety contract
        run: node --test tests/hipico_report_share_schema_contract.test.mjs
      - name: CLI owner-scope and network-safety contracts
        run: node --test tests/hipico_report_share_cli_contract.test.mjs
