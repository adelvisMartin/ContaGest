name: IAM #27 · aislamiento tenant/platform

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/auth/**'
      - 'backend/src/shared/identity/**'
      - 'backend/src/shared/middleware/context.ts'
      - 'backend/src/shared/commercial/**'
      - 'backend/src/shared/legal/**'
      - 'backend/prisma/migrations/**'
      - 'qa/iam-platform-real-v27.test.ts'
      - 'tests/issue_27_platform_iam_isolation.test.mjs'
      - 'scripts/iam-platform-isolation-audit.mjs'
      - 'ops/database/prepare-supabase-ephemeral.sql'
      - '.github/workflows/iam-platform-isolation-v27.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-v27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iam-postgres-real:
    name: IAM negativo + PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_iam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_iam_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_iam_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_iam_e2e?schema=public
      APP_URL: http://127.0.0.1:8080
      CORS_ORIGIN: http://127.0.0.1:8080
      JWT_SECRET: iam_v27_only_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEF
      LICENSE_HASH_SECRET: iam_v27_only_license_secret_0123456789abcdefghijklmnopqrstuvwxyz_XYZ
      ALLOW_DEV_TENANT_HEADER: 'true'
      SUPABASE_AUTH_FALLBACK: 'false'
      ALLOW_PUBLIC_REGISTER: 'false'

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias y cliente PostgreSQL
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preparar contratos Supabase mínimos en PostgreSQL temporal
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d contagest_iam_e2e -f ops/database/prepare-supabase-ephemeral.sql

      - name: Aplicar historial canónico de migraciones
        run: npm --workspace backend run prisma:deploy

      - name: Auditar invariantes IAM en fuente
        run: node scripts/iam-platform-isolation-audit.mjs

      - name: Ejecutar contratos estáticos #27
        run: node --test tests/issue_27_platform_iam_isolation.test.mjs

      - name: Validar tipos del backend
        run: npm --workspace backend run typecheck

      - name: Ejecutar tenant-admin negativo con HTTP + DB reales
        shell: bash
        run: |
          set -o pipefail
          npx tsx qa/iam-platform-real-v27.test.ts 2>&1 | tee iam-platform-v27.log

      - name: Capturar invariantes DB finales
        if: always()
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          {
            echo '=== bindings platform inválidos ==='
            psql -h 127.0.0.1 -U postgres -d contagest_iam_e2e -Atc "SELECT count(*) FROM public.\"RolePermission\" rp JOIN public.\"Role\" r ON r.\"id\"=rp.\"roleId\" JOIN public.\"Tenant\" t ON t.\"id\"=r.\"tenantId\" JOIN public.\"Permission\" p ON p.\"id\"=rp.\"permissionId\" WHERE p.\"key\" LIKE 'platform.%' AND (r.\"scope\"<>'platform' OR t.\"rif\"<>'00000000');" || true
          } >> iam-platform-v27.log 2>&1

      - name: Conservar evidencia IAM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-iam-v27
          path: iam-platform-v27.log
          if-no-files-found: warn
          retention-days: 14
