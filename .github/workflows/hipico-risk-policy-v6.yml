name: Hípico Risk Policy v6

on:
  pull_request:
    paths:
      - 'backend/src/modules/hipico/risk-policy*.ts'
      - 'backend/src/modules/hipico/agent-policy.ts'
      - 'backend/src/modules/hipico/agent-engine.ts'
      - 'backend/src/modules/hipico/agent.routes.ts'
      - 'backend/src/modules/hipico/automation.store.ts'
      - 'backend/src/modules/hipico/hipico-agent.integration.ts'
      - 'backend/prisma/migrations/20260914122000_hipico_risk_policy_v6/migration.sql'
      - 'supabase/sql/hipico_v23_risk_policy.sql'
      - '.github/workflows/hipico-risk-policy-v6.yml'
  workflow_dispatch:

permissions: { contents: read }

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hipico-risk-policy-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-risk-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: "${{ env.HIPICO_CANDIDATE_SHA }}"
          fetch-depth: 0

      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs

      - name: Configure Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create isolated ephemeral PostgreSQL database
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          db="hipico_agent_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"; db="${db,,}"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          url="postgresql://postgres:postgres@127.0.0.1:5432/${db}"
          echo "HIPICO_E2E_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "HIPICO_OWNER_ID=11111111-1111-4111-8111-111111111111" >> "$GITHUB_ENV"
          echo "HIPICO_SOURCE_GROUP_ID=group-a@g.us" >> "$GITHUB_ENV"
          echo "HIPICO_OPERATOR_CONTROL_TOKEN=ci-risk-policy-control-token-0001-strong" >> "$GITHUB_ENV"

      - name: Typecheck exact candidate
        run: npm --workspace backend run typecheck

      - name: Unit and policy regressions
        run: npm --workspace backend run test:hipico

      - name: Real PostgreSQL policy persistence and immutability
        run: npm --workspace backend run test:hipico:agent

      - name: Build backend exact candidate
        run: npm --workspace backend run build

      - name: Diff whitespace gate
        run: git diff --check "${{ github.event.pull_request.base.sha || 'HEAD^' }}" "${HIPICO_CANDIDATE_SHA}"

      - name: Drop isolated database even after failure
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          cleanup_rc=0
          if [ -n "${HIPICO_E2E_DATABASE_URL:-}" ]; then
            db="${HIPICO_E2E_DATABASE_URL##*/}"
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='${db}' and pid <> pg_backend_pid();" || cleanup_rc=1
            dropdb -h 127.0.0.1 -p 5432 -U postgres --if-exists "$db" || cleanup_rc=1
          fi
          exit "$cleanup_rc"
