name: Apply ContaGest v11.3.2

on:
  push:
    branches:
      - fix/v11.3.2-production-auth

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply v11.3.2 production stabilization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v11.3.2.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/v11.3.2.patch
          git apply --check /tmp/v11.3.2.patch
          git apply /tmp/v11.3.2.patch
          rm -rf .release
          rm -f .github/workflows/apply-v11-3-2.yml
      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply v11.3.2 production stabilization"
          git push origin HEAD:fix/v11.3.2-production-auth
