name: ContaGest CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contagest-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CORS_ORIGIN: http://localhost:4173
      ALLOW_PUBLIC_REGISTER: "false"
      ALLOW_DEV_TENANT_HEADER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma schema
        run: npm --workspace backend run db:validate

      - name: TypeScript
        run: npm run typecheck

      - name: Technical baseline freeze
        run: npm run baseline:verify

      - name: Architecture boundaries
        run: npm run audit:architecture

      - name: Database authority
        run: npm run audit:database-authority

      - name: Raw SQL security audit
        run: npm run audit:raw-sql-security

      - name: Design system authority
        run: npm run audit:design-system-authority

      - name: Vertical asset system
        run: npm run audit:vertical-assets

      - name: ERP Wave A source audit
        run: npm run audit:erp-ui-wave-a

      - name: Characterization and contract tests
        run: npm test

      - name: ERP visual system audit 58 routes
        run: npm run audit:visual:strict

      - name: ERP module function source audit 58 routes
        run: npm run audit:functions:strict

      - name: Frontend build
        run: npm run build:frontend

      - name: Backend build
        run: npm run build:backend

      - name: Bundle budget
        run: npm run check:bundle

      - name: Production dependency audit
        run: npm run audit:prod
