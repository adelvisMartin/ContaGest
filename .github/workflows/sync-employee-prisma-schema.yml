name: Sync employee Prisma schema

on:
  push:
    branches:
      - feat/v11.10-veterinary-clinic

permissions:
  contents: write

concurrency:
  group: sync-employee-prisma-schema
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11.10-veterinary-clinic
          fetch-depth: 0
      - name: Synchronize Prisma model
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('backend/prisma/schema.prisma')
          text = schema.read_text()
          old = '''  idNumber    String
  fullName    String
  position    String
  salary      Decimal @default(0) @db.Decimal(18,2)
  active      Boolean @default(true)'''
          new = '''  idNumber    String
  fullName    String
  position    String
  department  String?
  hiredAt     DateTime?
  salary      Decimal @default(0) @db.Decimal(18,2)
  active      Boolean @default(true)'''
          if old in text:
              text = text.replace(old, new, 1)
          if '@@index([tenantId, department])' not in text:
              marker = '  @@unique([tenantId, idNumber])\n}\n\nmodel PayrollPeriod'
              replacement = '  @@unique([tenantId, idNumber])\n  @@index([tenantId, department])\n  @@index([tenantId, hiredAt])\n}\n\nmodel PayrollPeriod'
              if marker not in text:
                  raise SystemExit('Employee index marker not found')
              text = text.replace(marker, replacement, 1)
          schema.write_text(text)

          schemas = Path('backend/src/modules/schemas.ts')
          text = schemas.read_text()
          old_schema = "export const employeeSchema = z.object({ idNumber: z.string().min(4), fullName: z.string().min(2), position: z.string().min(2), salary: z.coerce.number().optional(), active: z.boolean().optional() });"
          new_schema = "export const employeeSchema = z.object({ idNumber: z.string().min(4), fullName: z.string().min(2), position: z.string().min(2), department: z.string().max(120).optional(), hiredAt: z.coerce.date().optional(), salary: z.coerce.number().optional(), active: z.boolean().optional() });"
          if old_schema in text:
              schemas.write_text(text.replace(old_schema, new_schema, 1))
          PY
      - name: Commit synchronized schema
        run: |
          rm .github/workflows/sync-employee-prisma-schema.yml
          git config user.name "ContaGest CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/prisma/schema.prisma backend/src/modules/schemas.ts .github/workflows/sync-employee-prisma-schema.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: synchronize employee Prisma profile fields"
          git push origin HEAD:feat/v11.10-veterinary-clinic
