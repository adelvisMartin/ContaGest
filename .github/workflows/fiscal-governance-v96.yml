name: "Fiscal #96 · RBAC y state machine"

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/fiscal/**'
      - 'backend/prisma/migrations/**fiscal**'
      - 'backend/scripts/prisma-deploy-safe.mjs'
      - 'frontend/src/services/fiscalService.js'
      - 'frontend/src/pages/AccountingClosePage.js'
      - 'frontend/src/pages/TaxesPage.js'
      - 'qa/fiscal-governance-v96.test.ts'
      - 'tests/ci_ephemeral_database_contract.test.mjs'
      - 'docs/ADR_FISCAL_GOVERNANCE_V96.md'
      - '.github/workflows/fiscal-governance-v96.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-v96-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fiscal-postgres-real:
    name: Fiscal RBAC + audit PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_fiscal_v96_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_fiscal_v96_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      CI: 'true'
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_fiscal_v96_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_fiscal_v96_e2e?schema=public
      APP_URL: http://127.0.0.1:8080
      CORS_ORIGIN: http://127.0.0.1:8080
      JWT_SECRET: fiscal_v96_only_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz
      LICENSE_HASH_SECRET: fiscal_v96_only_license_secret_0123456789abcdefghijklmnopqrstuvwxyz
      SEED_ADMIN_PASSWORD: FiscalV96-QA-Password-2026!
      ALLOW_DEV_TENANT_HEADER: 'false'
      SUPABASE_AUTH_FALLBACK: 'false'
      ALLOW_PUBLIC_REGISTER: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prepare PostgreSQL contracts
        env: { PGPASSWORD: postgres }
        run: psql -h 127.0.0.1 -U postgres -d contagest_fiscal_v96_e2e -v ON_ERROR_STOP=1 -f ops/database/prepare-supabase-ephemeral.sql
      - name: Migrate
        run: npm --workspace backend run prisma:deploy
      - name: Seed
        run: npm --workspace backend run seed
      - name: Prisma validate
        run: npm --workspace backend run db:validate
      - name: TypeScript
        run: npm --workspace backend run typecheck
      - name: Fiscal PostgreSQL suite
        run: npm --workspace backend exec -- tsx --test ../qa/fiscal-governance-v96.test.ts
      - name: Accounting regression
        run: npm run test:backend:financial:real
      - name: Build
        run: npm run build