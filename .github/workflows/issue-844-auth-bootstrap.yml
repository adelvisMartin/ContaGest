name: Issue 844 auth bootstrap authority

on:
  push:
    branches:
      - codex/844-auth-bootstrap-authority
  pull_request:
    paths:
      - 'backend/prisma/migrations/**'
      - 'backend/src/database/auth-bootstrap*'
      - 'backend/src/database/runtime-tenant-context*'
      - 'backend/src/shared/middleware/context.ts'
      - 'backend/src/modules/auth/**'
      - 'backend/scripts/auth-bootstrap-v844.mjs'
      - 'backend/package.json'
      - '.github/workflows/issue-844-auth-bootstrap.yml'
      - 'docs/security/auth-bootstrap-authority-v844.md'

permissions:
  contents: read

jobs:
  auth-bootstrap-authority:
    name: PostgreSQL 17 + auth authority gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: contagest-v844-only
          POSTGRES_DB: contagest_v844
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_v844"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:contagest-v844-only@127.0.0.1:5432/contagest_v844?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:contagest-v844-only@127.0.0.1:5432/contagest_v844?schema=public
      NODE_ENV: test
      JWT_SECRET: issue-844-ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated auth bootstrap adversarial gate
        run: npm --workspace backend run test:auth-bootstrap:postgres
      - name: Run auth and tenant-context regressions
        run: |
          npm --workspace backend run test:auth-bootstrap:unit
          npm --workspace backend run test:runtime-tenant-context
      - name: Typecheck and build backend
        run: |
          npm --workspace backend run typecheck
          npm --workspace backend run build
      - name: Verify migration chain from zero and supported upgrades
        run: |
          npm --workspace backend run migration:test:from-zero
          npm --workspace backend run migration:test:upgrade
      - name: Run database and raw SQL authority audits
        run: |
          npm run audit:database-authority
          npm run audit:raw-sql-security
      - name: Route repository gates for changed backend scope
        run: npm run agent:gates -- --base main --type backend
