name: Release Governance Structural Apply #97

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-governance-structural-v97
  cancel-in-progress: true

jobs:
  protect-main:
    name: Aplicar protección estructural y verificar live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CONTAGEST_GOVERNANCE_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exigir token administrativo dedicado
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'BLOCKED: falta el secret CONTAGEST_GOVERNANCE_TOKEN con permiso Administration:write sobre este repositorio.'
            exit 3
          fi
          gh auth status

      - name: Contrato de automatización #97
        run: node --test tests/release_governance_auto_finalize_issue_97.test.mjs tests/release_governance_issue_97.test.mjs

      - name: Plan estructural
        run: node scripts/github-main-protection-v97.mjs plan

      - name: Aplicar Fase A estructural
        run: node scripts/github-main-protection-v97.mjs apply

      - name: Verificar Fase A live
        run: node scripts/github-main-protection-v97.mjs verify

      - name: Registrar evidencia honesta de proveedor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa/release-governance-auto-v97
          printf '{"issue":97,"profile":"structural","candidateSha":"%s","verdict":"PASS","requiredChecks":[],"remoteCi":"NOT_EXECUTED","remoteDeploy":"NOT_EXECUTED"}\n' "$GITHUB_SHA" > artifacts/qa/release-governance-auto-v97/summary.json

      - name: Conservar evidencia de governance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-governance-v97-${{ github.sha }}
          path: |
            artifacts/qa/release-governance-v97
            artifacts/qa/release-governance-auto-v97
          if-no-files-found: warn
          retention-days: 30
