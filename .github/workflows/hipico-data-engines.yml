name: Hípico Data Engines #285-#287/#290

on:
  pull_request:
    paths:
      - 'backend/src/app.ts'
      - 'backend/src/modules/hipico/**'
      - 'backend/src/modules/hipico-bot/**'
      - 'backend/scripts/hipico-restart-recovery-v290.ts'
      - 'backend/scripts/hipico-load-profile-v290.ts'
      - 'backend/package.json'
      - 'backend/prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/sql/hipico_v*.sql'
      - 'scripts/hipico-ephemeral-db-v290.mjs'
      - 'scripts/hipico-apply-e2e-schema-v290.mjs'
      - 'tests/hipico_postgres_e2e_chain_290.test.mjs'
      - 'docs/hipico/provider-research.md'
      - '.github/workflows/hipico-data-engines.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HIPICO_E2E_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  HIPICO_OWNER_ID: 11111111-1111-4111-8111-111111111111
  HIPICO_E2E_OWNER_ID: 11111111-1111-4111-8111-111111111111
  HIPICO_OPERATOR_CONTROL_TOKEN: ci-operator-control-token-285290-0001
  HIPICO_DOCUMENT_OCR_ENABLED: 'true'
  HIPICO_DOCUMENT_OCR_LANGUAGE: eng

concurrency:
  group: hipico-data-engines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HIPICO_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs

      - name: Configure Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Install bounded PDF/OCR and PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng postgresql-client

      - name: Create isolated ephemeral PostgreSQL database
        run: node scripts/hipico-ephemeral-db-v290.mjs create

      - name: Deploy Prisma schema needed by bot persistence
        run: npm --workspace backend run prisma:deploy

      - name: Rebuild current Hípico v12-v21 schema with RLS/RBAC evidence
        run: node scripts/hipico-apply-e2e-schema-v290.mjs

      - name: TestChannel classification/persistence/replay E2E
        run: npm --workspace backend exec -- tsx --test src/modules/hipico-bot/production-e2e-v290.ts

      - name: Prepare restart recovery state in process A
        run: npm --workspace backend exec -- tsx scripts/hipico-restart-recovery-v290.ts prepare

      - name: Verify restart recovery and replay in process B
        run: npm --workspace backend exec -- tsx scripts/hipico-restart-recovery-v290.ts verify

      - name: Typecheck canonical Hípico modules
        run: npm --workspace backend run typecheck

      - name: Unit and contract regressions
        run: npm run test:hipico

      - name: PostgreSQL chain contract
        run: node --test tests/hipico_postgres_e2e_chain_290.test.mjs

      - name: Build backend exact candidate
        run: npm --workspace backend run build

      - name: Real PostgreSQL + native PDF + OCR integration
        run: npm --workspace backend run test:hipico:data

      - name: Measure 100/500/2000 isolated production profile
        run: npm --workspace backend exec -- tsx scripts/hipico-load-profile-v290.ts

      - name: Runtime import and canonical route smoke
        shell: bash
        run: |
          set -euo pipefail
          evidence="artifacts/qa/hipico-data/${HIPICO_CANDIDATE_SHA}"
          mkdir -p "$evidence"
          PORT=3030 NODE_ENV=development node backend/dist/src/server.js >"$evidence/backend.log" 2>&1 &
          pid=$!
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 60 http://127.0.0.1:3030/health/live >"$evidence/health-live.json"
          for route in documents providers races; do
            status=$(curl --silent --output "$evidence/${route}.json" --write-out '%{http_code}' "http://127.0.0.1:3030/api/v1/hipico/${route}")
            test "$status" = "401"
          done
          grep -q '"status":"live"' "$evidence/health-live.json"

      - name: Drop isolated database even after failure
        if: always()
        run: node scripts/hipico-ephemeral-db-v290.mjs drop

      - name: Preserve SHA-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hipico-data-engines-${{ env.HIPICO_CANDIDATE_SHA }}
          path: |
            artifacts/qa/hipico-data/${{ env.HIPICO_CANDIDATE_SHA }}/
            artifacts/qa/hipico-v290/
          if-no-files-found: warn
          retention-days: 30
