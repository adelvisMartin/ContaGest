name: Hípico Data Engines #285-#287

on:
  pull_request:
    paths:
      - 'backend/src/app.ts'
      - 'backend/src/modules/hipico/**'
      - 'backend/src/modules/hipico-bot/hipico-race-provider*.ts'
      - 'backend/package.json'
      - 'supabase/sql/hipico_v14_documents.sql'
      - 'supabase/sql/hipico_v15_race_lifecycle.sql'
      - 'supabase/sql/hipico_v17_provider_evidence.sql'
      - 'supabase/sql/hipico_v18_race_result_stages.sql'
      - 'supabase/sql/hipico_v19_race_idempotency.sql'
      - 'supabase/sql/hipico_v20_document_audit.sql'
      - 'docs/hipico/provider-research.md'
      - '.github/workflows/hipico-data-engines.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hipico-data-engines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HIPICO_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs

      - name: Configure Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Install bounded PDF/OCR and PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr postgresql-client

      - name: Create isolated ephemeral PostgreSQL database
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          db="hipico_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          db="${db,,}"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          url="postgresql://postgres:postgres@127.0.0.1:5432/${db}"
          echo "HIPICO_E2E_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "HIPICO_OWNER_ID=11111111-1111-4111-8111-111111111111" >> "$GITHUB_ENV"
          echo "HIPICO_OPERATOR_CONTROL_TOKEN=ci-operator-control-token-285287-0001" >> "$GITHUB_ENV"

      - name: Typecheck canonical Hípico modules
        run: npm --workspace backend run typecheck

      - name: Unit and contract regressions
        run: npm run test:hipico

      - name: Build backend exact candidate
        run: npm --workspace backend run build

      - name: Real PostgreSQL + native PDF + OCR integration
        run: npm --workspace backend run test:hipico:data

      - name: Runtime import and canonical route smoke
        shell: bash
        run: |
          set -euo pipefail
          evidence="artifacts/qa/hipico-data/${HIPICO_CANDIDATE_SHA}"
          mkdir -p "$evidence"
          PORT=3030 NODE_ENV=development node backend/dist/src/server.js >"$evidence/backend.log" 2>&1 &
          pid=$!
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 60 http://127.0.0.1:3030/health/live >"$evidence/health-live.json"
          for route in documents providers races; do
            status=$(curl --silent --output "$evidence/${route}.json" --write-out '%{http_code}' "http://127.0.0.1:3030/api/v1/hipico/${route}")
            test "$status" = "401"
          done
          grep -q '"status":"live"' "$evidence/health-live.json"

      - name: Drop isolated database even after failure
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          cleanup_rc=0
          if [ -n "${HIPICO_E2E_DATABASE_URL:-}" ]; then
            db="${HIPICO_E2E_DATABASE_URL##*/}"
            if ! psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='${db}' and pid <> pg_backend_pid();"; then
              cleanup_rc=1
            fi
            if ! dropdb -h 127.0.0.1 -p 5432 -U postgres --if-exists "$db"; then
              cleanup_rc=1
            fi
          fi
          exit "$cleanup_rc"

      - name: Preserve SHA-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hipico-data-engines-${{ env.HIPICO_CANDIDATE_SHA }}
          path: artifacts/qa/hipico-data/${{ env.HIPICO_CANDIDATE_SHA }}/
          if-no-files-found: warn
          retention-days: 30
