name: Hípico Agent Shadow #288

on:
  pull_request:
    paths:
      - 'backend/src/app.ts'
      - 'backend/src/modules/hipico/agent-*.ts'
      - 'backend/src/modules/hipico/agent.routes.ts'
      - 'backend/src/modules/hipico/decision-provider*.ts'
      - 'backend/src/modules/hipico/jev-decision-provider*.ts'
      - 'backend/src/modules/hipico/automation.store.ts'
      - 'backend/src/modules/hipico/hipico-agent.integration.ts'
      - 'backend/prisma/migrations/20260913230500_hipico_agent_shadow/migration.sql'
      - 'backend/package.json'
      - 'backend/scripts/copy-runtime-assets.mjs'
      - 'backend/.env.example'
      - 'docs/hipico/README.md'
      - 'qa/fixtures/hipico-agent-golden-v1.json'
      - 'supabase/sql/hipico_v22_agent_shadow.sql'
      - '.github/workflows/hipico-agent-shadow.yml'
  workflow_dispatch:
permissions: { contents: read }
env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: hipico-agent-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  agent-shadow-security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with: { ref: "${{ env.HIPICO_CANDIDATE_SHA }}", fetch-depth: 0 }
      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs
      - name: Configure Node 22
        uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: package-lock.json }
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Create isolated ephemeral PostgreSQL database
        shell: bash
        env: { PGPASSWORD: postgres }
        run: |
          set -euo pipefail
          db="hipico_agent_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"; db="${db,,}"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          url="postgresql://postgres:postgres@127.0.0.1:5432/${db}"
          echo "HIPICO_E2E_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "HIPICO_OWNER_ID=11111111-1111-4111-8111-111111111111" >> "$GITHUB_ENV"
          echo "HIPICO_SOURCE_GROUP_ID=group-a@g.us" >> "$GITHUB_ENV"
          echo "HIPICO_OPERATOR_CONTROL_TOKEN=ci-agent-control-token-288-0001-strong" >> "$GITHUB_ENV"
      - name: Agent risk routing gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run agent:gates -- --base "$PR_BASE_SHA"
      - name: Typecheck canonical Hípico modules
        run: npm --workspace backend run typecheck
      - name: Unit, security and golden corpus regressions
        run: npm --workspace backend run test:hipico
      - name: Real PostgreSQL shadow and transition integration
        run: npm --workspace backend run test:hipico:agent
      - name: Build backend exact candidate
        run: npm --workspace backend run build
      - name: Runtime smoke SOURCE remains shadow and authenticated
        shell: bash
        run: |
          set -euo pipefail
          evidence="artifacts/qa/hipico-agent/${HIPICO_CANDIDATE_SHA}"; mkdir -p "$evidence"
          PORT=3031 NODE_ENV=development node backend/dist/src/server.js >"$evidence/backend.log" 2>&1 & pid=$!
          cleanup_runtime(){ if kill -0 "$pid" 2>/dev/null; then kill "$pid"; fi; }; trap cleanup_runtime EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 60 http://127.0.0.1:3031/health/live >"$evidence/health-live.json"
          status=$(curl --silent --output "$evidence/source-automation.json" --write-out '%{http_code}' -H 'x-hipico-operator-token: ci-agent-control-token-288-0001-strong' -H 'x-hipico-group-key: agent-e2e-a' 'http://127.0.0.1:3031/api/v1/hipico/groups/group-a@g.us/automation')
          test "$status" = "200"
          grep -q '"mode":"SHADOW"' "$evidence/source-automation.json"
          grep -q '"financialAuthority":false' "$evidence/source-automation.json"
          grep -q '"directEffectsAllowed":false' "$evidence/source-automation.json"
          grep -q '"eligibleForAssistedRanking":false' "$evidence/source-automation.json"
          grep -q '"reason":"PROVIDER_DISABLED"' "$evidence/source-automation.json"
          provider_status=$(curl --silent --output "$evidence/source-provider-metrics.json" --write-out '%{http_code}' -H 'x-hipico-operator-token: ci-agent-control-token-288-0001-strong' -H 'x-hipico-group-key: agent-e2e-a' 'http://127.0.0.1:3031/api/v1/hipico/groups/group-a@g.us/automation/provider-metrics')
          test "$provider_status" = "200"
          grep -q '"authoritative":false' "$evidence/source-provider-metrics.json"
          grep -q '"canAuthorize":false' "$evidence/source-provider-metrics.json"
      - name: Drop isolated database even after failure
        if: always()
        shell: bash
        env: { PGPASSWORD: postgres }
        run: |
          set -uo pipefail; cleanup_rc=0
          if [ -n "${HIPICO_E2E_DATABASE_URL:-}" ]; then
            db="${HIPICO_E2E_DATABASE_URL##*/}"
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='${db}' and pid <> pg_backend_pid();" || cleanup_rc=1
            dropdb -h 127.0.0.1 -p 5432 -U postgres --if-exists "$db" || cleanup_rc=1
          fi
          exit "$cleanup_rc"
      - name: Preserve SHA-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hipico-agent-shadow-${{ env.HIPICO_CANDIDATE_SHA }}
          path: artifacts/qa/hipico-agent/${{ env.HIPICO_CANDIDATE_SHA }}/
          if-no-files-found: warn
          retention-days: 30