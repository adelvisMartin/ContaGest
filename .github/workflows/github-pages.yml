name: GitHub Pages

on:
  pull_request:
    paths:
      - '.github/workflows/github-pages.yml'
      - 'frontend/**'
      - 'tests/github_pages_deploy_contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify GitHub Pages deployment contract
        run: node --test tests/github_pages_deploy_contract.test.mjs
