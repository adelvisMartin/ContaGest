name: "Benchmark #590 · dentistry gym veterinary runtime"

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/benchmark-verticals-v590.spec.mjs'
      - 'scripts/benchmark-verticals-v590.mjs'
      - 'tests/benchmark_verticals_v590_contract.test.mjs'
      - '.github/workflows/benchmark-verticals-v590.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  vertical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benchmark-v590-ci-only
          POSTGRES_DB: contagest_benchmark_v590
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_benchmark_v590"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:benchmark-v590-ci-only@127.0.0.1:5432/contagest_benchmark_v590?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:benchmark-v590-ci-only@127.0.0.1:5432/contagest_benchmark_v590?schema=public
      JWT_SECRET: benchmark-v590-ci-only-jwt-secret-0123456789-abcdef
      LICENSE_HASH_SECRET: benchmark-v590-ci-only-license-secret-0123456789-abcdef
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated PostgreSQL
        env: { PGPASSWORD: benchmark-v590-ci-only }
        run: psql -h 127.0.0.1 -U postgres -d contagest_benchmark_v590 -v ON_ERROR_STOP=1 -f ops/database/prepare-supabase-ephemeral.sql
      - name: Apply canonical migrations
        run: npm --workspace backend run prisma:deploy
      - run: npx playwright install --with-deps chromium
      - name: Execute vertical evidence harness
        run: node scripts/benchmark-verticals-v590.mjs
      - name: Upload exact-SHA vertical evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-v590-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/qa/benchmark-v590
            playwright-report
            test-results
          if-no-files-found: error
