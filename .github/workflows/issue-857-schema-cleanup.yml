name: Issue 857 schema diff cleanup

on:
  push:
    branches:
      - feat/857-business-location-authority
    paths:
      - .github/workflows/issue-857-schema-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/857-business-location-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild schema from main with only #857 semantic additions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:backend/prisma/schema.prisma > /tmp/schema-main.prisma
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/schema-main.prisma').read_text()

          tenant_anchor = '  documentSequences DocumentSequence[]\n'
          if tenant_anchor not in source:
              raise SystemExit('TENANT_ANCHOR_NOT_FOUND')
          source = source.replace(tenant_anchor, tenant_anchor + '  businessLocations BusinessLocation[]\n', 1)

          match = re.search(r'(model AddressGeocode \{.*?\n\})(\n\nmodel DemoAccess \{)', source, flags=re.S)
          if not match:
              raise SystemExit('ADDRESS_GEOCODE_BLOCK_NOT_FOUND')
          address_block = match.group(1)
          index_anchor = '  @@index([tenantId, address])\n'
          if index_anchor not in address_block:
              raise SystemExit('ADDRESS_INDEX_ANCHOR_NOT_FOUND')
          address_block = address_block.replace(index_anchor, '  businessLocations BusinessLocation[]\n\n' + index_anchor, 1)

          location_model = '''\n\nmodel BusinessLocation {\n  id               String   @id @default(uuid())\n  tenantId         String\n  code             String\n  name             String\n  status           String   @default("active")\n  timezone         String\n  addressGeocodeId String?\n  phone            String?\n  email            String?\n  createdBy        String?\n  updatedBy        String?\n  createdAt        DateTime @default(now())\n  updatedAt        DateTime @updatedAt\n\n  tenant         Tenant          @relation(fields: [tenantId], references: [id], onDelete: Restrict)\n  addressGeocode AddressGeocode? @relation(fields: [addressGeocodeId], references: [id], onDelete: SetNull)\n\n  @@unique([tenantId, code])\n  @@index([tenantId, status])\n  @@index([tenantId, addressGeocodeId])\n}\n'''

          source = source[:match.start(1)] + address_block + location_model + match.group(2) + source[match.end(2):]
          Path('backend/prisma/schema.prisma').write_text(source)
          PY
      - name: Validate exact cleaned candidate
        env:
          DATABASE_URL: postgresql://contagest:contagest@127.0.0.1:5432/contagest
          DIRECT_DATABASE_URL: postgresql://contagest:contagest@127.0.0.1:5432/contagest
        run: |
          set -euo pipefail
          npm ci
          npx prisma validate --schema backend/prisma/schema.prisma
          node --test tests/business_location_issue_857.test.mjs tests/route_manifest_architecture_issue_762.test.mjs
          npm run -w backend typecheck
          git diff --check
      - name: Publish cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-857-schema-cleanup.yml
          git add backend/prisma/schema.prisma
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(locations): minimize Prisma schema diff (#857)'
          git push origin HEAD:feat/857-business-location-authority
