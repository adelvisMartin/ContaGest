name: security-baseline

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'refactor/**'

permissions:
  contents: read

jobs:
  appsec-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Secret exposure, validation, CSP and rate-limit baseline
        run: node scripts/security-audit.mjs
