name: security-baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contagest-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appsec-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Baseline AppSec
        run: node scripts/security-audit.mjs
      - name: Contratos de seguridad de base de datos y recuperación
        run: node scripts/db-security-contract-audit.mjs
      - name: Aislamiento IAM tenant/platform
        run: node scripts/iam-platform-isolation-audit.mjs
      - name: IAM tenant/platform negative regressions
        run: node --test tests/iam_platform_isolation_runtime_contract.test.mjs
      - name: CSV spreadsheet injection and RFC4180 regression
        run: node --test tests/frontend_csv_formula_guard_v1313.test.mjs tests/master_export_v770.test.mjs
      - name: Hípico logout and refresh race regressions
        run: node --test tests/hipico_logout_revocation_v1292.test.mjs tests/hipico_logout_refresh_race_v1292.test.mjs
      - name: Privileged user session revocation and audit contract
        run: node --test tests/admin_session_revocation_v1312.test.mjs
      - name: PostgreSQL audit rollback trigger syntax contract
        run: node --test tests/qa_audit_rollback_trigger_contract_v1289_1313.test.mjs
