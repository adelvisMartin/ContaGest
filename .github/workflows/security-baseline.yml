name: security-baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contagest-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appsec-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Baseline AppSec
        run: node scripts/security-audit.mjs
      - name: Contratos de seguridad de base de datos y recuperación
        run: node scripts/db-security-contract-audit.mjs
      - name: Aislamiento IAM tenant/platform
        run: node scripts/iam-platform-isolation-audit.mjs
