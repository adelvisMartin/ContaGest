name: Control Hipico Android RC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/hipico-control-v1130/**'
      - 'frontend/public/hipico-control/**'
      - 'products/hipico-control/**'
      - '.github/workflows/hipico-android-rc.yml'

permissions:
  contents: read

concurrency:
  group: hipico-android-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build reproducible debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hipico-control-v1130/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Install locked wrapper dependencies
        working-directory: android/hipico-control-v1130
        run: npm ci --no-audit --no-fund

      - name: Dependency high-severity gate
        working-directory: android/hipico-control-v1130
        run: npm audit --audit-level=high

      - name: Verify canonical PWA parity
        working-directory: android/hipico-control-v1130
        run: npm run verify:web

      - name: Build and package QA APK
        working-directory: android/hipico-control-v1130
        run: npm run android:qa

      - name: Verify packaged artifact metadata
        shell: bash
        working-directory: android/hipico-control-v1130
        run: |
          test -s artifacts/Hipico-Control-v1.13.0-rc2-debug.apk
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/QA_APK_METADATA.json
          cat artifacts/SHA256SUMS.txt
          cat artifacts/QA_APK_METADATA.json

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-hipico-v1.13.0-rc2-debug-${{ github.sha }}
          path: android/hipico-control-v1130/artifacts/
          if-no-files-found: error
          retention-days: 14
