name: Control Hipico Android RC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/hipico-control-v1130/**'
      - 'frontend/public/hipico-control/**'
      - 'products/hipico-control/**'
      - 'scripts/hipico-release-v118.mjs'
      - 'tests/hipico_release_distribution_issue_118.test.mjs'
      - 'docs/hipico/RELEASE-DISTRIBUTION-118.md'
      - '.github/workflows/hipico-android-rc.yml'

permissions:
  contents: read

concurrency:
  group: hipico-android-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build reproducible debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hipico-control-v1130/package-lock.json

      - name: Release policy contract
        env:
          HIPICO_RELEASE_SHA: ${{ github.sha }}
        run: |
          node --test tests/hipico_release_distribution_issue_118.test.mjs
          node scripts/hipico-release-v118.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Install locked wrapper dependencies
        working-directory: android/hipico-control-v1130
        run: npm ci --no-audit --no-fund

      - name: Dependency high-severity gate
        working-directory: android/hipico-control-v1130
        run: npm audit --audit-level=high

      - name: Sync and verify canonical PWA parity
        working-directory: android/hipico-control-v1130
        run: |
          npm run sync:web
          npm run verify:web

      - name: Build and package QA APK
        working-directory: android/hipico-control-v1130
        env:
          HIPICO_RELEASE_SHA: ${{ github.sha }}
        run: npm run android:qa

      - name: Verify packaged artifact and bind it to release manifest
        env:
          HIPICO_RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/hipico-release-v118.mjs --require-apk
          node -e "const fs=require('fs');const p=require('./products/hipico-control/release-policy.json');const m=JSON.parse(fs.readFileSync('./android/hipico-control-v1130/artifacts/QA_APK_METADATA.json'));if(m.version!==p.version||m.versionCode!==p.versionCode||m.candidateSha!==process.env.HIPICO_RELEASE_SHA)process.exit(1);console.log(JSON.stringify(m,null,2));"
          cat android/hipico-control-v1130/artifacts/SHA256SUMS.txt

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: control-hipico-debug-${{ github.sha }}
          path: android/hipico-control-v1130/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA-bound release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-hipico-release-evidence-${{ github.sha }}
          path: artifacts/qa/hipico-v118/
          if-no-files-found: warn
          retention-days: 30
