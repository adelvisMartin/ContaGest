name: Hípico Browser Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/public/hipico-control/**'
      - 'frontend/api/hipico/**'
      - 'backend/src/modules/hipico-bot/**'
      - 'products/hipico-control/**'
      - 'qa/hipico-*.spec.mjs'
      - 'qa/support/hipico-*.mjs'
      - 'playwright.hipico-matrix.config.mjs'
      - '.github/workflows/hipico-browser-matrix.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hipico-browser-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-browser:
    name: Hípico visual-functional / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HIPICO_CANDIDATE_SHA }}

      - name: Confirm exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$HIPICO_CANDIDATE_SHA"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Install browser runtime
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Hípico visual-functional matrix
        env:
          HIPICO_QA_SHA: ${{ env.HIPICO_CANDIDATE_SHA }}
        run: npx playwright test --config=playwright.hipico-matrix.config.mjs --project=${{ matrix.project }} --workers=1

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hipico-${{ matrix.project }}-${{ env.HIPICO_CANDIDATE_SHA }}
          path: |
            artifacts/qa/hipico-v105/${{ env.HIPICO_CANDIDATE_SHA }}
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14
