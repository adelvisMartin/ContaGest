name: TEMP lock repair v26

on:
  push:
    branches:
      - fix/runtime-xlsx-lock-followup
    paths:
      - .github/workflows/lock-repair-v26-temp.yml

permissions:
  contents: write

jobs:
  lock-repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/runtime-xlsx-lock-followup

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Normalize retired XLSX dependency graph
        run: node scripts/normalize-package-lock-v26.mjs

      - name: Regenerate lock with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lock contracts
        run: |
          node --test tests/toolchain_lock_normalizer_issue_26.test.mjs
          node --test tests/toolchain_dependency_cleanup_issue_26.test.mjs

      - name: Commit generated lock only
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- package-lock.json)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): regenerate package lock after XLSX runtime removal #26"
            git push origin HEAD:fix/runtime-xlsx-lock-followup
          }
