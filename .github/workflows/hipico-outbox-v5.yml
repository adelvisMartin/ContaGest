name: Hipico Outbox v5 Exact SHA

on:
  push:
    branches:
      - feat/hipico-production-outbox-v5
      - main
    paths:
      - 'backend/src/modules/hipico-bot/**'
      - 'backend/src/server.ts'
      - 'backend/package.json'
      - 'package-lock.json'
      - 'backend/prisma/migrations/**'
      - 'supabase/sql/hipico_v21_*.sql'
      - '.github/workflows/hipico-outbox-v5.yml'
  pull_request:
    paths:
      - 'backend/src/modules/hipico-bot/**'
      - 'backend/src/server.ts'
      - 'backend/package.json'
      - 'package-lock.json'
      - 'backend/prisma/migrations/**'
      - 'supabase/sql/hipico_v21_*.sql'
      - '.github/workflows/hipico-outbox-v5.yml'

permissions:
  contents: read

concurrency:
  group: hipico-outbox-v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-sha / typecheck / hipico / postgres / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_hipico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_hipico_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_hipico_test?schema=public
      HIPICO_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_hipico_test?schema=public
      HIPICO_BOT_PROMOTION: shadow
      HIPICO_CLOUD_SEND_ENABLED: 'false'
      HIPICO_OUTBOX_WORKER_ENABLED: 'false'

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies from root workspace lock
        run: npm ci --workspace backend --include-workspace-root --no-audit --no-fund

      - name: Bootstrap PostgreSQL compatibility identities
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d contagest_hipico_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          SQL

      - name: Apply canonical outbox migrations twice
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          for pass in 1 2; do
            echo "migration replay pass=${pass}"
            psql -h 127.0.0.1 -U postgres -d contagest_hipico_test -v ON_ERROR_STOP=1 -f supabase/sql/hipico_v21_production_outbox.sql
            psql -h 127.0.0.1 -U postgres -d contagest_hipico_test -v ON_ERROR_STOP=1 -f supabase/sql/hipico_v21_outbox_reconciliation_audit.sql
          done

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Real PostgreSQL and concurrency contract
        working-directory: backend
        run: npx tsx --test src/modules/hipico-bot/hipico-outbox.postgres.test.ts

      - name: Control Hipico tests
        working-directory: backend
        run: npm run test:hipico

      - name: Build
        working-directory: backend
        run: npm run build
