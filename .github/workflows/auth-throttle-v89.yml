name: "Auth #89 · throttle anti-DoS real"

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/auth/**'
      - 'backend/src/shared/middleware/security.ts'
      - 'backend/.env.example'
      - 'backend/prisma/**'
      - 'backend/scripts/prisma-deploy-safe.mjs'
      - 'qa/auth-throttle-issue-89.test.ts'
      - 'qa/auth-throttle-hardening-issue-89.test.ts'
      - 'tests/ci_ephemeral_database_contract.test.mjs'
      - 'docs/AUTH_THROTTLE_ISSUE_89.md'
      - 'docs/AUTH_SECURITY_BENCHMARK_V1117.md'
      - '.github/workflows/auth-throttle-v89.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-v89-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-throttle-postgres:
    name: Auth throttle + PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contagest_auth_v89_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contagest_auth_v89_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      CI: 'true'
      API_MODE: prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_auth_v89_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contagest_auth_v89_e2e?schema=public
      JWT_SECRET: qa89_only_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEF
      LICENSE_HASH_SECRET: qa89_only_license_secret_0123456789abcdefghijklmnopqrstuvwxyz_XYZ
      SUPABASE_AUTH_FALLBACK: 'false'
      ALLOW_DEV_TENANT_HEADER: 'false'
      AUTH_LOGIN_FAILURE_LIMIT: '3'
      AUTH_LOGIN_OBSERVATION_WINDOW_SECONDS: '2'
      AUTH_LOGIN_LOCK_SECONDS: '2'
      AUTH_LOGIN_ATTEMPT_RETENTION_DAYS: '7'

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas y cliente PostgreSQL
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preparar prerequisitos Supabase mínimos
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -o pipefail
          psql -h 127.0.0.1 -U postgres -d contagest_auth_v89_e2e \
            -v ON_ERROR_STOP=1 \
            -f ops/database/prepare-supabase-ephemeral.sql 2>&1 | tee prerequisitos-v89.log

      - name: Aplicar historial canónico de migraciones
        shell: bash
        run: |
          set -o pipefail
          npm --workspace backend run prisma:deploy 2>&1 | tee migration-v89.log
          npx prisma migrate status --schema backend/prisma/schema.prisma 2>&1 | tee -a migration-v89.log

      - name: Unit · política, normalización, ventana, expiración y concurrencia lógica
        shell: bash
        run: |
          set -o pipefail
          npm --workspace backend exec -- tsx --test src/modules/auth/auth.throttle.test.ts 2>&1 | tee auth-unit-v89.log

      - name: Integration · API + PostgreSQL real
        shell: bash
        run: |
          set -o pipefail
          npm --workspace backend exec -- tsx --test ../qa/auth-throttle-issue-89.test.ts 2>&1 | tee auth-integration-v89.log

      - name: Security · enumeración, timing coarse guard y retención sin login válido
        shell: bash
        run: |
          set -o pipefail
          npm --workspace backend exec -- tsx --test ../qa/auth-throttle-hardening-issue-89.test.ts 2>&1 | tee auth-hardening-v89.log

      - name: Contrato estático anti-regresión
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "Quedan .*intento" backend/src/modules/auth/auth.routes.ts
          ! grep -n "Usuario bloqueado después" backend/src/modules/auth/auth.routes.ts
          ! grep -n "data:{status:'disabled'}" backend/src/modules/auth/auth.routes.ts
          grep -n "verifyCaptcha(req.body)" backend/src/modules/auth/auth.routes.ts
          grep -n "authRateLimit, authRoutes" backend/src/app.ts
          grep -n "INVALID_LOGIN_MESSAGE" backend/src/modules/auth/auth.routes.ts
          grep -n "dummyPasswordHashPromise" backend/src/modules/auth/auth.routes.ts
          grep -n "mode:'insensitive'" backend/src/modules/auth/auth.routes.ts
          grep -n "maybePruneExpiredLoginAttempts" backend/src/modules/auth/auth.throttle.ts

      - name: Lint y contratos globales
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee auth-lint-v89.log

      - name: Typecheck y build backend
        shell: bash
        run: |
          set -o pipefail
          npm --workspace backend run typecheck 2>&1 | tee auth-typecheck-v89.log
          npm --workspace backend run build 2>&1 | tee auth-build-v89.log

      - name: Capturar identidad del candidato
        if: always()
        shell: bash
        run: |
          {
            echo "candidate_sha=${GITHUB_SHA}"
            echo "base_sha=${{ github.event.pull_request.base.sha || 'workflow_dispatch' }}"
            echo "failure_limit=${AUTH_LOGIN_FAILURE_LIMIT}"
            echo "observation_seconds=${AUTH_LOGIN_OBSERVATION_WINDOW_SECONDS}"
            echo "lock_seconds=${AUTH_LOGIN_LOCK_SECONDS}"
            echo "retention_days=${AUTH_LOGIN_ATTEMPT_RETENTION_DAYS}"
          } > candidate-v89.txt

      - name: Conservar evidencia Auth #89
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-auth-v89
          path: |
            prerequisitos-v89.log
            migration-v89.log
            auth-unit-v89.log
            auth-integration-v89.log
            auth-hardening-v89.log
            auth-lint-v89.log
            auth-typecheck-v89.log
            auth-build-v89.log
            candidate-v89.txt
          if-no-files-found: warn
          retention-days: 14
