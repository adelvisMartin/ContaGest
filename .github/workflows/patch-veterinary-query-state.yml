name: Patch veterinary query state

on:
  push:
    branches:
      - feat/v11.10-veterinary-clinic
    paths:
      - .github/workflows/patch-veterinary-query-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11.10-veterinary-clinic
      - name: Synchronize veterinary query state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/VeterinaryClinicPage.jsx')
          text = path.read_text()
          old = """  const updateUrl = (nextTab, patientId) => {
    const current = UrlStateService.getParams();
    const params = { ...current, tab: nextTab || current.tab || tabRef.current || 'resumen' };
    const nextPatient = patientId || current.patient || patientRef.current;
    if (nextPatient) params.patient = nextPatient;
    else delete params.patient;
    window.history.replaceState({ module: 'veterinaria' }, '', UrlStateService.href('veterinaria', params));
  };"""
          new = """  const updateUrl = (nextTab, patientId) => {
    const current = UrlStateService.getParams();
    const resolvedTab = nextTab || current.tab || tabRef.current || 'resumen';
    const nextPatient = patientId || current.patient || patientRef.current || '';
    UrlStateService.setParams({ tab: resolvedTab, patient: nextPatient }, { replace: false });
  };"""
          if old not in text:
              raise SystemExit('updateUrl block not found')
          text = text.replace(old, new, 1)
          old_click = "onClick={() => selectPatient(item.id)}"
          new_click = "onClick={(event) => { event.stopPropagation(); selectPatient(item.id); }}"
          if old_click not in text:
              raise SystemExit('patient click handler not found')
          text = text.replace(old_click, new_click, 1)
          path.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name "ContaGest CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/VeterinaryClinicPage.jsx
          git commit -m "fix: persist veterinary tab and patient query state"
          git push origin HEAD:feat/v11.10-veterinary-clinic
