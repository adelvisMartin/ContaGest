name: Diagnose v11.10 remount

on:
  push:
    branches: [feat/v11.10-veterinary-clinic]
    paths:
      - .github/workflows/diagnose-v1110-remount.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11.10-veterinary-clinic
          fetch-depth: 1
      - name: Find Store writes and global click handlers
        run: |
          echo '=== STORE WRITES ==='
          grep -RIn --include='*.js' --include='*.jsx' --include='*.ts' 'Store\.set\|store\.set\|setState' frontend/src | head -300 || true
          echo '=== CLICK LISTENERS ==='
          grep -RIn --include='*.js' --include='*.jsx' --include='*.ts' "addEventListener(['\"]click\|closest(.*data-route\|data-care-patient\|data-query-param" frontend/src | head -500 || true
          echo '=== ROUTE HANDLERS ==='
          grep -RIn --include='*.js' --include='*.jsx' --include='*.ts' 'data-route\|cg:navigate\|navigation' frontend/src/app.js frontend/src/components frontend/src/services frontend/src/state | head -700 || true
