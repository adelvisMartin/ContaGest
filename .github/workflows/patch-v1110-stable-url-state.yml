name: Patch v11.10 stable URL state

on:
  push:
    branches: [feat/v11.10-veterinary-clinic]
    paths:
      - .github/workflows/patch-v1110-stable-url-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11.10-veterinary-clinic
          fetch-depth: 0

      - name: Stabilize veterinary tab and patient deep links
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/VeterinaryClinicPage.jsx')
          source = path.read_text()

          old = "  const [selectedPatientId, setSelectedPatientId] = useState(query.patient || '');\n  const [encounters, setEncounters] = useState([]);"
          new = "  const [selectedPatientId, setSelectedPatientId] = useState(query.patient || '');\n  const tabRef = useRef(TABS.some(([key]) => key === query.tab) ? query.tab : 'resumen');\n  const patientRef = useRef(query.patient || '');\n  const [encounters, setEncounters] = useState([]);"
          assert old in source, 'state insertion point not found'
          source = source.replace(old, new, 1)

          old = "  const updateUrl = (nextTab = tab, patientId = selectedPatientId) => {\n    const params = { tab: nextTab };\n    if (patientId) params.patient = patientId;\n    window.history.replaceState({ module: 'veterinaria' }, '', UrlStateService.href('veterinaria', params));\n  };"
          new = "  const updateUrl = (nextTab, patientId) => {\n    const current = UrlStateService.getParams();\n    const params = { ...current, tab: nextTab || current.tab || tabRef.current || 'resumen' };\n    const nextPatient = patientId || current.patient || patientRef.current;\n    if (nextPatient) params.patient = nextPatient;\n    else delete params.patient;\n    window.history.replaceState({ module: 'veterinaria' }, '', UrlStateService.href('veterinaria', params));\n  };"
          assert old in source, 'updateUrl block not found'
          source = source.replace(old, new, 1)

          old = "      if (!selectedPatientId && pets.length) {\n        setSelectedPatientId(pets[0].id);\n        updateUrl(tab, pets[0].id);\n      }"
          new = "      if (!patientRef.current && pets.length) {\n        patientRef.current = pets[0].id;\n        setSelectedPatientId(pets[0].id);\n        updateUrl(UrlStateService.get('tab', tabRef.current || 'resumen'), pets[0].id);\n      }"
          assert old in source, 'loadBase default patient block not found'
          source = source.replace(old, new, 1)

          old = "  const changeTab = (_event, value) => { setTab(value); updateUrl(value, selectedPatientId); };\n  const selectPatient = (id) => { setSelectedPatientId(id); updateUrl('pacientes', id); };"
          new = "  const changeTab = (_event, value) => {\n    tabRef.current = value;\n    setTab(value);\n    updateUrl(value, patientRef.current);\n  };\n  const selectPatient = (id) => {\n    patientRef.current = id;\n    tabRef.current = 'pacientes';\n    setSelectedPatientId(id);\n    setTab('pacientes');\n    updateUrl('pacientes', id);\n  };"
          assert old in source, 'tab/patient handlers not found'
          source = source.replace(old, new, 1)

          old = "onClick={(event) => { event.stopPropagation(); setTab(key); updateUrl(key, selectedPatientId); }}"
          new = "onClick={(event) => { event.stopPropagation(); tabRef.current = key; setTab(key); updateUrl(key, patientRef.current); }}"
          assert old in source, 'tab click handler not found'
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Commit stable URL state
        run: |
          git config user.name "ContaGest QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/VeterinaryClinicPage.jsx
          git commit -m "fix: stabilize veterinary deep-link state"
          git push origin HEAD:feat/v11.10-veterinary-clinic
