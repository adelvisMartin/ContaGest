name: Hípico Core Refactor v8

on:
  pull_request:
    paths:
      - 'backend/src/modules/hipico/agent-*.ts'
      - 'backend/src/modules/hipico/agent.routes.ts'
      - 'backend/src/modules/hipico/automation-*.ts'
      - 'backend/src/modules/hipico/core-refactor-*.test.ts'
      - 'backend/src/modules/hipico/promotion-policy.ts'
      - 'backend/src/modules/hipico/risk-policy.ts'
      - 'backend/src/modules/hipico/shadow-metrics.ts'
      - 'backend/src/modules/hipico-bot/hipico-outbox*.ts'
      - '.github/workflows/hipico-core-refactor-v8.yml'
  workflow_dispatch:

permissions: { contents: read }

env:
  HIPICO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hipico-core-refactor-v8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavior-preserving-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: "${{ env.HIPICO_CANDIDATE_SHA }}"
          fetch-depth: 0

      - name: Exact candidate SHA and clean-tree gate
        run: node scripts/hipico-exact-sha-gate.mjs

      - name: Configure Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create isolated PostgreSQL databases
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          agent_db="hipico_agent_e2e_${suffix}"; agent_db="${agent_db,,}"
          outbox_db="hipico_outbox_e2e_${suffix}"; outbox_db="${outbox_db,,}"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$agent_db"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$outbox_db"
          agent_url="postgresql://postgres:postgres@127.0.0.1:5432/${agent_db}"
          outbox_url="postgresql://postgres:postgres@127.0.0.1:5432/${outbox_db}"
          echo "HIPICO_E2E_DATABASE_URL=$agent_url" >> "$GITHUB_ENV"
          echo "HIPICO_TEST_POSTGRES_URL=$outbox_url" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$outbox_url" >> "$GITHUB_ENV"
          echo "HIPICO_OWNER_ID=11111111-1111-4111-8111-111111111111" >> "$GITHUB_ENV"
          echo "HIPICO_SOURCE_GROUP_ID=group-a@g.us" >> "$GITHUB_ENV"

      - name: Bootstrap canonical outbox PostgreSQL schema
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          outbox_db="${HIPICO_TEST_POSTGRES_URL##*/}"
          psql -h 127.0.0.1 -p 5432 -U postgres -d "$outbox_db" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          SQL
          for pass in 1 2; do
            echo "canonical outbox migration replay pass=${pass}"
            psql -h 127.0.0.1 -p 5432 -U postgres -d "$outbox_db" -v ON_ERROR_STOP=1 -f supabase/sql/hipico_v21_production_outbox.sql
            psql -h 127.0.0.1 -p 5432 -U postgres -d "$outbox_db" -v ON_ERROR_STOP=1 -f supabase/sql/hipico_v21_outbox_reconciliation_audit.sql
          done

      - name: Typecheck exact candidate
        run: npm --workspace backend run typecheck

      - name: Hípico unit, contract and outbox PostgreSQL regressions
        env:
          HIPICO_CLOUD_SEND_ENABLED: 'false'
          HIPICO_OUTBOX_WORKER_ENABLED: 'false'
        run: npm --workspace backend run test:hipico

      - name: Agent PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$HIPICO_E2E_DATABASE_URL"
          npm --workspace backend run test:hipico:agent

      - name: Build backend exact candidate
        run: npm --workspace backend run build

      - name: Diff whitespace gate
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${HIPICO_CANDIDATE_SHA}^}"
          git diff --check "$base" "$HIPICO_CANDIDATE_SHA"

      - name: Drop isolated databases even after failure
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          cleanup_rc=0
          for url in "${HIPICO_E2E_DATABASE_URL:-}" "${HIPICO_TEST_POSTGRES_URL:-}"; do
            [ -z "$url" ] && continue
            db="${url##*/}"
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='${db}' and pid <> pg_backend_pid();" \
              || cleanup_rc=1
            dropdb -h 127.0.0.1 -p 5432 -U postgres --if-exists "$db" || cleanup_rc=1
          done
          exit "$cleanup_rc"
