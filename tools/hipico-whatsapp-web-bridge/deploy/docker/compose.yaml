services:
  control-hipico-bridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: control-hipico-whatsapp-bridge:1.4.1
    container_name: control-hipico-bridge
    restart: unless-stopped
    init: true
    env_file:
      - ./bridge.env
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /run:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - hipico_bridge_data:/var/lib/control-hipico-bridge
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/usr/local/bin/node", "src/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hipico_bridge_data:
    name: control_hipico_bridge_data
